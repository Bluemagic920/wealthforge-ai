name: Campaign activation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node tools/check-syntax.cjs
      - name: Locate temporary database tools
        run: echo "PH_PG_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - name: Campaign API, interface and isolated database checks
        run: node --test tests/*.test.cjs
